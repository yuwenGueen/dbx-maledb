name: Release MaLeDB
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.4"
          cache: false
      - name: Confirm validated native platform
        run: node -e 'if(process.platform!=="darwin"||process.arch!=="arm64")process.exit(1)'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - run: npm test
      - run: npm run release:metadata
      - name: Publish immutable unsigned candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This version already exists. Publish a new version instead of replacing assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.dbxp dist/*.artifact.json dist/*.dbxp.sha256 dist/release-candidates.json \
            --verify-tag --title "麻了DB ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
